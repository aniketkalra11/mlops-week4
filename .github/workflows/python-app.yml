name: Python package

on:
  push:
    branches:
      - dev # Replace with your branch name
  pull_request:
    branches:
      - main # Replace with your branch name

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Replace with your desired Python version

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run pytest
      - name: Run pytest
        run: |
          python -m test 2>&1 > test_output.txt
      
      - name: Install CML
        run: npm install -g @dvcorg/cml

      - name: Create CML report
        env:
            REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            echo "test output" > report.md
            echo "\`\`\`" >> report.md
            cat test_output.txt >> report.md
            echo "\`\`\`" > report.md
            echo "metrics from training" >> report.md
            cat metrics.csv >> report.md
            cml comment create --publish report.md